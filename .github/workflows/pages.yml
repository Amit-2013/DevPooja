name: Deploy demo to GitHub Pages

# Rebuilds on every push, so the published snapshot is never older than the last deploy.
# The weekly run matters too: the demo seed creates bookings relative to "today", so
# without a refresh the demo would eventually show nothing but past pujas.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Reuse the shared Node test job (setup, tests, annotations, audit gate) —
  # the same single source of truth ci.yml calls. A broken build never publishes.
  tests:
    name: Node tests (Pages gate)
    uses: ./.github/workflows/node-tests.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 13 requires Node 22 or newer, so the tests cannot run below it.
          node-version: '22'
          cache: npm
      - run: npm ci
      # Same silent-optional-deps guard as node-tests.yml: the snapshot build
      # seeds photos through sharp, so a missing prebuild degrades the demo.
      - name: Verify sharp prebuilds landed
        id: verify-sharp
        run: node -e "require('sharp'); console.log('sharp native prebuilds OK')"
      - name: Retry install (optional-dep downloads can flake silently)
        if: failure() && steps.verify-sharp.conclusion == 'failure'
        run: npm ci
      - name: Verify sharp prebuilds landed (after retry)
        if: failure() && steps.verify-sharp.conclusion == 'failure'
        run: node -e "require('sharp'); console.log('sharp native prebuilds OK after retry')"
      - run: npm run build:pages
      # Assert the artifact BEFORE it is uploaded: the build itself was once green
      # while the published demo 404'd on every image and refused reads beyond /state.
      # Serves dist/ at the /<repo>/ subpath and checks the shim, the demo snapshots,
      # the PagesDemo.request() fallbacks and every referenced /media/ file.
      - name: Pages artifact smoke (static fallbacks + images resolve)
        run: node tests/pages-smoke.js
      - uses: actions/configure-pages@v5
        with:
          # enablement can only CREATE a Pages site with a PAT: the default
          # GITHUB_TOKEN gets "Resource not accessible by integration" (the
          # failure that blocked daivikpujarender until its site was made by
          # hand). PAGES_PAT (classic, repo scope) reads and creates; the
          # fallback keeps GET-only runs working where the secret is absent.
          # Rotate the secret whenever that PAT is rotated.
          enablement: true
          token: ${{ secrets.PAGES_PAT || github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
