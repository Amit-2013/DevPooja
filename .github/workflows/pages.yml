name: Deploy demo to GitHub Pages

# Rebuilds on every push, so the published snapshot is never older than the last deploy.
# The weekly run matters too: the demo seed creates bookings relative to "today", so
# without a refresh the demo would eventually show nothing but past pujas.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned image: same rationale as ci.yml (test steps failed twice on
    # ubuntu-latest with no related code change; local runs are always green).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 13 requires Node 22 or newer, so the tests cannot run below it.
          node-version: '22'
          cache: npm
      - run: npm ci
      # Never publish a snapshot of a broken build.
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/pages-test.log
      - name: Test failure details
        if: failure()
        run: echo "::error::npm test failed on the Pages build — $(tail -c 1200 /tmp/pages-test.log | tr '\r\n' '  ')"
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
