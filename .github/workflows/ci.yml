# CI — triggers only. The job definitions live in the reusable workflows:
#   .github/workflows/node-tests.yml    (Node/Express suite + npm audit gate)
#   .github/workflows/python-tests.yml  (FastAPI suite + pip-audit gate)
# Edit the reusable files to change how either backend is tested; edit THIS file
# only for triggers (push/PR/monthly drift-catcher) or job wiring.
#
# The monthly scheduled run (3rd, 05:23 UTC) is the drift-catcher between pushes:
# - new GitHub advisories fail the npm audit and pip-audit gates even with no
#   code change;
# - backend-python/requirements.txt uses >= bounds, so `pip install -r` can pick
#   up newer releases since the last push — the monthly run surfaces breakage
#   from floating dependencies before a real deploy does;
# - the pinned runner image still receives patch refreshes, so toolchain
#   regressions show up here too.
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity —
# if this ever stops firing, that is why (re-enable in the Actions tab).

name: CI

on:
  push:
  pull_request:
  schedule:
    # Monthly drift-catcher: fixed day-of-month so it is a true monthly cadence.
    # tests/test_ci_wiring.py guards this line — removing it fails the suite.
    - cron: '23 5 3 * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (Express + SQLite)
    uses: ./.github/workflows/node-tests.yml

  python:
    name: Python (FastAPI + pytest)
    uses: ./.github/workflows/python-tests.yml
