name: CI

# Run the Node/Express suite and the Python/FastAPI suite on every push and PR.
# Both backends run in parallel; the Python suite includes the full
# SQLite->Postgres migration dress rehearsal when a source db is present
# (it self-skips on CI where data/*.db is gitignored).

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node (Express + SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API tests (node --test)
        run: npm test

      - name: Astro tests
        run: node --test tests/astro.test.js

      - name: UI smoke (jsdom)
        run: npm run test:ui

      - name: Security audit (advisories only)
        run: npm audit --audit-level=high
        continue-on-error: true   # report, don't gate — uuid override policy is manual

  python-tests:
    name: Python (FastAPI + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: python -m pytest -q
